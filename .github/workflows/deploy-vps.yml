# CI/CD: test on GitHub, then SSH-sync and reload PM2 on the VPS.
# Required GitHub secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY
# Remote path is /home/developer/aj-rvcc. Do not overwrite the VPS ecosystem.config.cjs (ports 3010-3013).
name: VPS CI/CD

on:
  push:
    branches:
      - prod
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/rvcc' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Database Schema
        run: pnpm --filter api db:validate

      - name: Generate Prisma Client
        run: pnpm --filter api db:generate

      - name: Run Monorepo Tests
        run: pnpm test

      - name: Build All Packages
        run: pnpm build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

  deploy-vps:
    name: Sync, build, and reload PM2
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Require VPS secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "::error::VPS_HOST is not set. Add repository secrets VPS_HOST, VPS_USER, and VPS_SSH_KEY. GitHub did not update the VPS."
            exit 1
          fi

      # drone-ssh default protocol is tcp (IPv6 first). A broken AAAA record
      # or Hostinger firewall dropping GitHub runner IPs shows up as:
      #   dial tcp ***:22: i/o timeout
      - name: Check VPS SSH port from GitHub
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          host="${VPS_HOST%%:*}"
          echo "Probing SSH on port 22 (IPv4). Host is a repository secret."
          for i in 1 2 3 4 5 6; do
            if nc -z -w 12 -4 "$host" 22; then
              echo "SSH port reachable on attempt $i"
              exit 0
            fi
            echo "attempt $i: SSH port not reachable yet"
            sleep 8
          done
          echo "::error::GitHub Actions cannot open TCP 22 to VPS_HOST. Open SSH in the Hostinger firewall for 0.0.0.0/0 (keep key-only auth) or allow GitHub Actions IPs. Then re-run this workflow."
          exit 1

      - name: Ensure the remote app directory exists
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          protocol: tcp4
          timeout: 1m
          script: mkdir -p /home/developer/aj-rvcc

      - name: Sync source to the VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude-from=scripts/rsync-deploy-exclude.txt
          path: ./
          remote_path: /home/developer/aj-rvcc/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Install, build, and reload PM2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          protocol: tcp4
          timeout: 1m
          command_timeout: 20m
          script: |
            cd /home/developer/aj-rvcc
            chmod +x scripts/vps-deploy.sh
            bash scripts/vps-deploy.sh

# Cloudflare Worker for the unified API.
# Workers Builds: Root directory = `apps/api`, install = `npm ci`, build = `npm run build`.
# Build pipeline: prebuild (DB migrations) → tsc → postbuild (wrangler deploy in CI).

name = "rvcc-api"
main = "src/worker.ts"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[triggers]
crons = ["*/5 * * * *"]

[vars]
ALLOWED_ORIGINS = "https://site.147-93-105-74.nip.io,https://vendor.147-93-105-74.nip.io,https://admin.147-93-105-74.nip.io,https://procurement.147-93-105-74.nip.io,http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003"
VENDOR_PORTAL_URL = "https://vendor.147-93-105-74.nip.io"
# Optional Hyperdrive (production): create in Cloudflare dashboard, then add:
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<your-hyperdrive-config-id>"
SMTP_HOST = "smtp.office365.com"
SMTP_PORT = "587"
SMTP_SECURE = "false"
SMTP_USER = "rvcc-admin@rvcc.com.sa"
SMTP_FROM = "RVCC Procurement <rvcc-admin@rvcc.com.sa>"
ENQUIRE_FROM_EMAIL = "RVCC Procurement <rvcc-admin@rvcc.com.sa>"
# Public URL for uploaded files — R2 development domain for rvcc-public-assets
R2_PUBLIC_URL = "https://pub-70b8c21f306842d3bbeab4d1d19319e1.r2.dev"
R2_ACCOUNT_ID = "d17302a485a00dcb8339cce02701183f"
R2_BUCKET_NAME = "rvcc-public-assets"

[[r2_buckets]]
binding = "PUBLIC_ASSETS"
bucket_name = "rvcc-public-assets"

[[r2_buckets]]
binding = "SECURE_ASSETS"
bucket_name = "rvcc-secure-assets"

# Secrets (wrangler secret put …):
#   DATABASE_URL
#   SMTP_PASS
#   EMAIL_GATE_SECRET   (optional; defaults to DATABASE_URL)
#   R2_ACCESS_KEY_ID    (local Node dev / S3 fallback — create in R2 → Manage API tokens)
#   R2_SECRET_ACCESS_KEY

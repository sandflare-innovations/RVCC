# Cloudflare Worker for the unified API.
# Workers Builds: Root directory = `apps/api`, install = `npm ci`, build = `npm run build`.
# Build pipeline: prebuild (DB migrations) → tsc → postbuild (wrangler deploy in CI).

name = "rvcc-api"
main = "src/worker.ts"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://rvcc-enquiry.vercel.app,https://rvcc-vendor.vercel.app,https://rvcc-admin.vercel.app,http://localhost:3000,http://localhost:3001,http://localhost:3002"
VENDOR_PORTAL_URL = "https://rvcc-vendor.vercel.app"
# Optional Hyperdrive (production): create in Cloudflare dashboard, then add:
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<your-hyperdrive-config-id>"
SMTP_HOST = "smtp.gmail.com"
SMTP_PORT = "587"
SMTP_SECURE = "false"
SMTP_USER = "flyincob2b@gmail.com"
ENQUIRE_FROM_EMAIL = "RVCC Procurement <flyincob2b@gmail.com>"
# Public URL for uploaded files — enable “Public Development URL” on rvcc-uploads, then set this to that pub-*.r2.dev URL
R2_PUBLIC_URL = "https://pub-aae9a6117dfe4a3694df38a0660161be.r2.dev"
R2_ACCOUNT_ID = "d17302a485a00dcb8339cce02701183f"
R2_BUCKET_NAME = "rvcc-uploads"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "rvcc-uploads"

# Secrets (wrangler secret put …):
#   DATABASE_URL
#   SMTP_PASS
#   EMAIL_GATE_SECRET   (optional; defaults to DATABASE_URL)
#   R2_ACCESS_KEY_ID    (local Node dev / S3 fallback — create in R2 → Manage API tokens)
#   R2_SECRET_ACCESS_KEY

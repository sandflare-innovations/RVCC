<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0073bc">
  <title>Offline | RVCC Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 50%, #f1f5f9 100%);
      color: #18181b;
      overflow: hidden;
      position: relative;
    }

    /* Animated background pattern */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(circle at 20% 80%, rgba(0, 115, 188, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(0, 115, 188, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(0, 115, 188, 0.03) 0%, transparent 70%);
      animation: bgPulse 8s ease-in-out infinite;
    }

    @keyframes bgPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .container {
      text-align: center;
      padding: 3rem 2rem;
      max-width: 480px;
      position: relative;
      z-index: 1;
    }

    /* Cloud/Connection Icon */
    .icon-wrap {
      margin: 0 auto 2.5rem;
      width: 120px;
      height: 120px;
      position: relative;
    }

    .icon-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0073bc 0%, #005a94 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        0 20px 60px rgba(0, 115, 188, 0.2),
        0 8px 24px rgba(0, 115, 188, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      animation: iconFloat 4s ease-in-out infinite;
    }

    @keyframes iconFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .icon-circle svg {
      width: 48px;
      height: 48px;
      color: white;
    }

    /* Pulse rings */
    .pulse-ring {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 2px solid rgba(0, 115, 188, 0.15);
      animation: pulseRing 3s ease-in-out infinite;
    }

    .pulse-ring:nth-child(2) {
      inset: -24px;
      animation-delay: 0.5s;
      border-color: rgba(0, 115, 188, 0.08);
    }

    .pulse-ring:nth-child(3) {
      inset: -38px;
      animation-delay: 1s;
      border-color: rgba(0, 115, 188, 0.04);
    }

    @keyframes pulseRing {
      0%, 100% { transform: scale(0.95); opacity: 0.5; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    .brand-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(0, 115, 188, 0.08);
      border: 1px solid rgba(0, 115, 188, 0.12);
      color: #0073bc;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .brand-tag .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
      animation: dotPulse 2s ease-in-out infinite;
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #18181b;
      margin-bottom: 0.75rem;
      letter-spacing: -0.025em;
    }

    p {
      font-size: 0.9375rem;
      color: #71717a;
      line-height: 1.6;
      max-width: 360px;
      margin: 0 auto 2rem;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      background: linear-gradient(135deg, #0073bc 0%, #005a94 100%);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 
        0 4px 16px rgba(0, 115, 188, 0.25),
        0 2px 4px rgba(0, 115, 188, 0.15);
      font-family: inherit;
    }

    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 
        0 8px 24px rgba(0, 115, 188, 0.3),
        0 4px 8px rgba(0, 115, 188, 0.2);
    }

    .retry-btn:active {
      transform: translateY(0);
    }

    .retry-btn svg {
      width: 18px;
      height: 18px;
      transition: transform 0.3s ease;
    }

    .retry-btn:hover svg {
      transform: rotate(180deg);
    }

    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.5rem;
      text-align: center;
    }

    .footer-logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #a1a1aa;
      font-size: 12px;
      font-weight: 500;
    }

    .footer-logo img {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      opacity: 0.5;
    }

    /* Connection status dots */
    .status-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 2rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d4d4d8;
      animation: statusBlink 2s ease-in-out infinite;
    }

    .status-dot:nth-child(1) { animation-delay: 0s; }
    .status-dot:nth-child(2) { animation-delay: 0.3s; }
    .status-dot:nth-child(3) { animation-delay: 0.6s; }

    @keyframes statusBlink {
      0%, 100% { background: #d4d4d8; transform: scale(1); }
      50% { background: #0073bc; transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrap">
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <div class="icon-circle">
        <!-- Wi-Fi Off Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h.01"/>
          <path d="M8.5 16.429a5 5 0 0 1 7 0"/>
          <path d="M5 12.859a10 10 0 0 1 5.17-2.69"/>
          <path d="M13.83 10.17A10 10 0 0 1 19 12.859"/>
          <path d="M2 8.82a15 15 0 0 1 4.17-2.65"/>
          <path d="M10.66 6.005A15 15 0 0 1 22 8.82"/>
          <line x1="2" y1="2" x2="22" y2="22"/>
        </svg>
      </div>
    </div>

    <div class="brand-tag">
      <span class="dot"></span>
      RVCC Admin
    </div>

    <h1>You're Offline</h1>
    <p>
      It looks like you've lost your internet connection. 
      Check your network and try again to access the admin panel.
    </p>

    <button class="retry-btn" onclick="window.location.reload()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
      </svg>
      Try Again
    </button>

    <div class="status-dots">
      <div class="status-dot"></div>
      <div class="status-dot"></div>
      <div class="status-dot"></div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-logo">
      <img src="/images/logo/logo.webp" alt="" onerror="this.style.display='none'">
      RVCC Administration Portal
    </div>
  </div>

  <script>
    // Auto-retry when connection is restored
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>

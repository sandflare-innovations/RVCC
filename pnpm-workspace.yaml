packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@ffmpeg-installer/darwin-arm64': true
  '@ffmpeg-installer/darwin-x64': true
  '@ffmpeg-installer/ffmpeg': true
  '@ffmpeg-installer/linux-arm': true
  '@ffmpeg-installer/linux-arm64': true
  '@ffmpeg-installer/linux-ia32': true
  '@ffmpeg-installer/linux-x64': true
  '@ffmpeg-installer/win32-ia32': true
  '@ffmpeg-installer/win32-x64': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  workerd: true

onlyBuiltDependencies:
  - "@ffmpeg-installer/darwin-arm64"
  - "@ffmpeg-installer/darwin-x64"
  - "@ffmpeg-installer/ffmpeg"
  - "@ffmpeg-installer/linux-arm"
  - "@ffmpeg-installer/linux-arm64"
  - "@ffmpeg-installer/linux-ia32"
  - "@ffmpeg-installer/linux-x64"
  - "@ffmpeg-installer/win32-ia32"
  - "@ffmpeg-installer/win32-x64"
  - "@prisma/client"
  - "@prisma/engines"
  - "esbuild"
  - "prisma"
  - "sharp"
  - "unrs-resolver"
  - "workerd"

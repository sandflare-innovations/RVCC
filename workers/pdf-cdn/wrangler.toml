name = "rvcc-pdf-cdn"
main = "src/index.ts"
compatibility_date = "2025-04-01"
workers_dev = true

# Most PDFs + pdf.js live on Cloudflare Workers Static Assets (edge).
# PDFs > 25 MiB pull from Vercel once, then Cache API.
#
#   npm run prepare
#   npm run deploy
#   Set NEXT_PUBLIC_PDF_CDN_URL=https://rvcc-pdf-cdn.rvcc.workers.dev

[assets]
directory = "./public"
binding = "FILES"
# Worker must run first: Static Assets alone returned 200 for Range (not 206)
# and 405 for CORS OPTIONS — both break pdf.js cross-origin loads.
run_worker_first = true
# Native asset serving via env.FILES.fetch(); Worker adds CORS + Range fixups.
not_found_handling = "none"

[vars]
ORIGIN_URL = "https://rvcc-dev.vercel.app"
ALLOWED_ORIGINS = "*"

# Optional R2 for the 166MB water-feature PDF (enable R2 in Dashboard first):
# [[r2_buckets]]
# binding = "ASSETS"
# bucket_name = "rvcc-pdf-assets"

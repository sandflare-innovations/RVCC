name = "rvcc-admin-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Secrets (wrangler secret put …):
#   API_SECRET            — shared with apps/admin ADMIN_API_SECRET
#   DATABASE_URL          — only if not using Hyperdrive yet
#   ENQUIRE_API_SECRET    — shared with enquire Worker API_SECRET (for notify)
#   ENQUIRE_WORKER_URL    — https://rvcc-enquire-api.rvcc.workers.dev
#   VENDOR_PORTAL_URL     — https://rvcc-app.vercel.app (no trailing slash)
#
# Hyperdrive (recommended — keeps Postgres credentials off Vercel):
#   npx wrangler hyperdrive create rvcc-admin --connection-string="postgresql://..."
#   then set id below.

[vars]
# Prod portals + local Next ports (3000 web / 3001 admin / 3002 vendor)
ALLOWED_ORIGINS = "https://rvcc-prod.vercel.app,https://rvcc-app.vercel.app,https://rvcc-admin.vercel.app,http://localhost:3000,http://localhost:3001,http://localhost:3002"

# Uncomment after creating Hyperdrive:
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "YOUR_HYPERDRIVE_ID"
